<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Maya</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10121b;color:#f3f4ff;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(160deg,#171a2a,#10121b)}header{padding:18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #292d40}.orb{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8b83ff 30%,#4442b9 70%);box-shadow:0 0 22px #7774ff66}header h1{margin:0;font-size:20px}header small{color:#9fa5c7}.tools{padding:8px 14px;display:flex;gap:8px}.tools button{flex:1;background:#23263a;border:1px solid #3b405c;color:#dce0ff;border-radius:12px;padding:10px}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:85%;padding:12px 14px;border-radius:17px;white-space:pre-wrap;line-height:1.4}.maya{align-self:flex-start;background:#242840;border:1px solid #343a5a}.user{align-self:flex-end;background:#5451bb}.welcome{color:#aeb4d4;font-size:14px;padding:5px}.inputrow{padding:12px;display:flex;gap:8px;background:#171a27;border-top:1px solid #2a2d40}.inputrow input{flex:1;min-width:0;padding:13px;border-radius:14px;border:1px solid #373c58;background:#22253a;color:white;font-size:16px}.inputrow button{border:0;border-radius:14px;padding:0 16px;background:#7773f4;color:white;font-size:16px}.inputrow .mic{background:#32364e}.foot{padding:0 12px 8px;color:#7f86a8;font-size:11px;text-align:center}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px}.box{width:100%;max-width:440px;background:#20243a;padding:18px;border-radius:18px}.box h2{margin-top:0}.box input{width:100%;padding:12px;background:#111526;color:white;border:1px solid #454b6b;border-radius:10px;margin:6px 0 12px}.box button{padding:10px;border:0;border-radius:10px;background:#7773f4;color:white}.box .close{background:#343953;margin-left:8px}.box p{font-size:13px;color:#aeb4d4}
</style></head>
<body><div class="app"><header><div class="orb"></div><div><h1>Maya</h1><small>AI assistant · Hindi chat</small></div></header><div class="tools"><button onclick="settings()">⚙️ API settings</button><button onclick="clearChat()">🗑️ Clear chat</button></div><div id="chat"><div class="welcome">Namaste! Main Maya hoon. Message likho ya mic se bolo.</div></div><div class="inputrow"><input id="msg" placeholder="Maya se baat karo…" autocomplete="off"><button class="mic" onclick="voice()">🎙️</button><button onclick="send()">➤</button></div><div class="foot">API key device par rakhi jaati hai. Phone-control actions is demo mein nahi hain.</div></div>
<div class="modal" id="modal"><div class="box"><h2>API settings</h2><p>Google AI Studio se apni API key lo. Key ko kisi ke saath share mat karo. Browser storage mein save hogi.</p><input id="key" type="password" placeholder="API key"><input id="model" value="gemini-flash-latest" placeholder="Model"><button onclick="save()">Save</button><button class="close" onclick="settings(false)">Close</button></div></div>
<script>
const chat=document.getElementById('chat'),msg=document.getElementById('msg');let history=[];
function bubble(t,who){let d=document.createElement('div');d.className='bubble '+who;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function settings(show=true){document.getElementById('modal').style.display=show?'flex':'none';if(show){document.getElementById('key').value=localStorage.getItem('mayaKey')||'';document.getElementById('model').value=localStorage.getItem('mayaModel')||'gemini-flash-latest'}}
function save(){let k=document.getElementById('key').value.trim();if(k)localStorage.setItem('mayaKey',k);localStorage.setItem('mayaModel',document.getElementById('model').value.trim()||'gemini-flash-latest');settings(false);bubble('Settings save ho gayi.','maya')}
function clearChat(){history=[];chat.innerHTML='<div class="welcome">Chat cleared. Phir se baat shuru karo.</div>'}
async function send(){let text=msg.value.trim();if(!text)return;msg.value='';bubble(text,'user');history.push({role:'user',parts:[{text}]});let loading=bubble('Soch rahi hoon…','maya');let key=localStorage.getItem('mayaKey');if(!key){loading.textContent='Pehle ⚙️ API settings mein API key save karo.';history.pop();return}try{let model=localStorage.getItem('mayaModel')||'gemini-flash-latest';let contents=history.slice(-12);contents.unshift({role:'user',parts:[{text:'You are Maya, a friendly, supportive Hindi/Hinglish assistant. Be respectful, non-romantic, and concise.'}]});let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','X-goog-api-key':key},body:JSON.stringify({contents})});let data=await r.json();if(!r.ok)throw Error(data?.error?.message||('HTTP '+r.status));let answer=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'Response nahi mila.';loading.textContent=answer;history.push({role:'model',parts:[{text:answer}]});}catch(e){loading.textContent='Connection error: '+e.message+'\nAPI key / model / internet check karo.';history.pop()}}
msg.addEventListener('keydown',e=>{if(e.key==='Enter')send()});function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){bubble('Voice recognition is browser mein available nahi.','maya');return}let rec=new SR();rec.lang='hi-IN';rec.onresult=e=>{msg.value=e.results[0][0].transcript;send()};rec.onerror=e=>bubble('Mic error: '+e.error,'maya');rec.start()}
</script></body></html>
